name: Build add-on image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-addon-image.yml"
      - "umdu_haos_updater/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ADDON_DIR: umdu_haos_updater
  IMAGE_NAME: ghcr.io/umduru/umdu-haos-updater

jobs:
  build:
    name: Build and publish aarch64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' "${ADDON_DIR}/config.yaml")"
          if [ -z "${version}" ]; then
            echo "Unable to read version from ${ADDON_DIR}/config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ADDON_DIR }}
          file: ${{ env.ADDON_DIR }}/Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.addon.outputs.version }}
          build-args: |
            ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
            BUILD_VERSION=${{ steps.addon.outputs.version }}
            BUILD_ARCH=aarch64
            PIP_INDEX_URL=https://pypi.org/simple
